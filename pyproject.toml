[project]
name = "prytt"
version = "0.3.0"
description = "Drop-in awsglue + PySpark shim: run unmodified AWS Glue 6 job scripts locally on Sail."
requires-python = ">=3.13"
dependencies = [
    "pysail>=0.7.3",
    "pyspark-client>=4.1,<4.2",
]

[dependency-groups]
dev = [
    "pre-commit>=4",
    "pytest>=8",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prytt", "src/awsglue", "src/awsgluedq"]

[tool.hatch.build.targets.wheel.force-include]
# Lands at the site-packages root, so it runs at every interpreter start.
"prytt.pth" = "prytt.pth"

[tool.hatch.build.targets.sdist]
include = ["src", "prytt.pth", "tests", "README.md"]

[project.entry-points.pytest11]
prytt = "prytt.pytest_plugin"

[tool.pytest.ini_options]
# tests/live (marker s3_live) is opt-in, run only by `mise run test:s3-live`.
testpaths = ["tests/unit", "tests/acceptance"]
addopts = "-p pytester"
markers = ["s3_live: reads real S3 (opt-in, needs PRYTT_TEST_S3_URI and AWS credentials)"]
# Hang diagnostics: at 60 s dump every thread's stack (non-fatal, works even if
# a C call holds the GIL); at 180 s kill the run so CI fails fast instead of
# hanging. "thread", because SIGALRM can't interrupt a blocked gRPC call.
faulthandler_timeout = 60
timeout = 180
timeout_method = "thread"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Job scripts copy real Glue scripts, which use `from awsglue.transforms import *`.
"examples/glue_selftest_job.py" = ["F403", "F405"]
"tests/acceptance/scripts/*.py" = ["F403", "F405"]

[tools]
python = "3.13"
uv = "latest"

[env]
# Unset, never set: with it unset prytt starts its own in-process Sail server.
# Setting it makes prytt connect to that address instead. `false` unsets it for
# every `mise run` task (and CI), even if your shell exports one. To use your own
# server, run the script outside mise.
SPARK_REMOTE = false
